<!DOCTYPE html>
<html>
  <head>
    <style>
      img {
        width: 50px;
        height: 50px;
        border-radius: 50px;
        object-fit: cover;
        vertical-align: middle;
      }
      input {
        width: 220px;
        vertical-align: middle;
        padding: 4px;
        border: none;
      }
      button {
        color: white;
        background-color: rgb(64, 126, 220);
        border-radius: 18px;
        border: none;
        padding: 7px;
        padding-left: 13px;
        padding-right: 13px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="../thumbnails/thumbnail-2.webp">
    <input type="text" placeholder="What's happeninig?">
    <button class="button">Tweet</button>
  </body>
</html>
